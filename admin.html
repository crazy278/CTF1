<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .login-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(10px);
        }
        
        .login-title {
            text-align: center;
            color: #333;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input {
            padding: 1rem;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            font-family: 'Tajawal', sans-serif;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .login-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }
        
        .back-link {
            text-align: center;
            margin-top: 2rem;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .admin-content {
            display: none;
        }
        
        .logout-btn {
            background: #dc3545;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
        }
        
        .admin-header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 2rem 0;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        
        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 0.5rem;
        }
        
        .data-table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-top: 2rem;
        }
        
        .table-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 2fr;
            gap: 1rem;
            font-weight: 600;
        }
        
        .table-row {
            padding: 1rem;
            border-bottom: 1px solid #e1e1e1;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 2fr;
            gap: 1rem;
            align-items: center;
        }
        
        .table-row:hover {
            background: #f8f9fa;
        }
        
        .scout-badge {
            background: #28a745;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        
        .non-scout-badge {
            background: #6c757d;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        
        .export-section {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            margin: 2rem 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .export-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .back-btn {
            background: #6c757d;
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            .table-header, .table-row {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            
            .table-header {
                display: none;
            }
            
            .table-row {
                border: 1px solid #e1e1e1;
                border-radius: 8px;
                margin-bottom: 1rem;
            }
            
            .table-cell {
                display: flex;
                justify-content: space-between;
                padding: 0.5rem 0;
                border-bottom: 1px solid #f0f0f0;
            }
            
            .table-cell:last-child {
                border-bottom: none;
            }
            
            .table-cell::before {
                content: attr(data-label);
                font-weight: 600;
                color: #667eea;
            }
        }
    </style>
</head>
<body>
    <!-- صفحة تسجيل الدخول -->
    <div id="loginPage" class="login-container">
        <div class="login-box">
            <h2 class="login-title">🔐 تسجيل الدخول</h2>
            <div class="error-message" id="errorMessage">
                كلمة المرور خاطئة! يرجى المحاولة مرة أخرى
            </div>
            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="submit" class="login-btn">دخول</button>
            </form>
            <div class="back-link">
                <a href="index.html">← العودة للموقع الرئيسي</a>
            </div>
        </div>
    </div>

    <!-- محتوى لوحة التحكم -->
    <div id="adminContent" class="admin-content">
        <header class="admin-header">
            <div class="container">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1>🔐 لوحة التحكم</h1>
                        <p>إدارة بيانات المشاركين في أسبوع صاحب العصر والزمان</p>
                    </div>
                    <div>
                        <a href="index.html" class="back-btn">← الموقع الرئيسي</a>
                        <button onclick="logout()" class="logout-btn" style="margin-right: 1rem;">تسجيل خروج</button>
                    </div>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="container">
                <!-- الإحصائيات -->
                <div class="stats-container">
                    <div class="stat-card">
                        <div class="stat-number" id="totalCount">0</div>
                        <div class="stat-label">إجمالي المشاركين</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="scoutCount">0</div>
                        <div class="stat-label">المرشدون</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="nonScoutCount">0</div>
                        <div class="stat-label">غير المرشدين</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="todayCount">0</div>
                        <div class="stat-label">مسجلين اليوم</div>
                    </div>
                </div>

                <!-- تصدير البيانات -->
                <div class="export-section">
                    <h2>📊 تصدير البيانات</h2>
                    <div class="export-buttons">
                        <button onclick="exportToJSON()" class="action-btn">📄 تصدير JSON</button>
                        <button onclick="exportToCSV()" class="action-btn">📊 تصدير CSV</button>
                        <button onclick="printData()" class="action-btn">🖨️ طباعة</button>
                        <button onclick="clearAllData()" class="action-btn" style="background: #dc3545;">🗑️ حذف الكل</button>
                    </div>
                </div>

                <!-- جدول البيانات -->
                <div class="data-table">
                    <div class="table-header">
                        <div>الاسم</div>
                        <div>الهاتف</div>
                        <div>النوع</div>
                        <div>الفوج</div>
                        <div>التاريخ</div>
                        <div>العام</div>
                        <div>التوقعات</div>
                    </div>
                    <div id="dataTableBody">
                        <!-- البيانات ستظهر هنا -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
